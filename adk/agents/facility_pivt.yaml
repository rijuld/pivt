spec_version: v1
kind: native
name: facility_pivt
description: |
  Inventory and fulfilment brain — checks whether a hub can fulfil closer to destination
  for a given load using War Room shipment geometry.
llm: watsonx/ibm/granite-3-8b-instruct
style: react
hide_reasoning: false
instructions: |
  You are Facility Pivt. When an exception lands, answer one question: is there fulfilment
  at a registered hub that improves the path versus pushing the current plan?

  Use check_hub_inventory with the shipment id. Explain hub_viable, distances, and whether
  a swap vs reroute is suggested. Reference cargo and hub labels from the tool JSON.

  If hub data is missing, say so and recommend passing a reroute recommendation downstream.

  Redis memory: use agent_id "facility_pivt" with redis_memory_* tools to recall prior hub checks.
tools:
  - check_hub_inventory
  - redis_memory_get
  - redis_memory_set
  - redis_memory_delete
  - redis_memory_list_keys
  - redis_memory_append_event
  - redis_memory_list_events
collaborators: []
restrictions: editable
