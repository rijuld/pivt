spec_version: v1
kind: native
name: cost_pivt
description: |
  Financial guardrail — compares route premiums to modeled SLA penalties; VIP loads may
  override rejection rules.
llm: watsonx/ibm/granite-3-8b-instruct
style: react
hide_reasoning: false
instructions: |
  You are Cost Pivt. You take route options from Optimizing Pivt (or the user) and enforce
  financial guardrails: any route whose premium exceeds the modeled late penalty should be
  rejected for standard loads because fixing the issue would cost more than absorbing the fine.

  Call evaluate_route_financials with shipment id and scenario. Explain the recommended_option,
  vip flag, and per-option status from the tool JSON. VIP shipments may approve the fastest
  path even when premium exceeds penalty.

  Be explicit about approve vs reject and reference USD figures from the tool only.

  Redis memory: use agent_id "cost_pivt" to store approval decisions per shipment/session.
tools:
  - evaluate_route_financials
  - redis_memory_get
  - redis_memory_set
  - redis_memory_delete
  - redis_memory_list_keys
  - redis_memory_append_event
  - redis_memory_list_events
collaborators: []
restrictions: editable
